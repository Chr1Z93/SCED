name: build-mod
on:
  workflow_dispatch:
  release:
    types: [created]
  pull_request:

permissions: read-all

jobs:
  build-the-mod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Make TTSModManager executable
        run: chmod +x .vscode/bin/TTSModManager
        shell: bash

      - name: Set dynamic filename
        id: filename
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            stripped_name=$(echo "${{ github.event.release.tag_name }}" | sed -E 's/^[Vv]ersion[ ]*//')
            echo "filename=Arkham SCE ${stripped_name}.json" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "filename=${{ github.head_ref }}.json" >> $GITHUB_ENV
          else
            echo "filename=output.json" >> $GITHUB_ENV
          fi

      - name: Run TTSModManager
        run: |
          ./.vscode/bin/TTSModManager -moddir="./" -modfile="./${{ env.filename }}"
          if [ ! -f "./${{ env.filename }}" ]; then
            echo "Build failed: output file was not created."
            exit 1
          fi
        shell: bash

      - name: Upload built mod
        uses: actions/upload-artifact@v7.0.1
        with:
          name: TTSMod
          path: ./${{ env.filename }}

      - name: Add built mod to release
        uses: softprops/action-gh-release@v3.0.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.filename }}
